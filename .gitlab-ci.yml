default:
  tags:
    - boldyrev-04

stages:
  - proverka

shellcheck:
  stage: proverka
  image: koalaman/shellcheck-alpine:stable
  rules:
    # Проверяем изменения скриптов и CI в push-пайплайне.
    # Изменения только документации не запускают задачу.
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.sh"
        - .gitlab-ci.yml
  script:
    - echo "Вариант 04, слово devlab"
    - shellcheck --version
    - find . -name '*.sh' -print
    - find . -name '*.sh' -exec shellcheck {} +

yamllint:
  stage: proverka
  image: alpine:3.20
  before_script:
    - apk add --no-cache yamllint
  script:
    - yamllint -d relaxed work-02/cloud-init.tpl.yaml

.yc:
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq gettext openssh-keygen >/dev/null
    - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a -i /usr/local >/dev/null
    - export PATH=/usr/local/bin:$PATH
    - yc config profile create ci
    - yc config set service-account-key "$YC_KEY_STAGE"   # у вас — суффикс своего окружения
    - yc config set cloud-id "$YC_CLOUD_ID"
    - yc config set folder-id "$YC_FOLDER_ID"

# ручная задача: запускается кнопкой, ресурсов не создаёт
proverka-dostupa:
  extends: .yc
  stage: proverka
  when: manual
  script:
    - echo "Проверяю доступ, вариант 04, слово devlab"   # у вас — свои
    - yc vpc network list
